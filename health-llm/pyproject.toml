[project]
name = "health-llm"
version = "0.1.0"
description = "A local, fine-tuned health Coach: small open model + LoRA + the dashboard tools + research RAG, on Apple Silicon"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.8.0",
    "datasets>=5.2.0",
    "fastapi>=0.162.7",
    "pandas>=3.1.1",
    "peft>=0.21.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthllm"]

[project.scripts]
coach = "healthllm.cli:main"
